[package]
name = "yadacall-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "yadacall"
path = "src/main.rs"

[dependencies]
yc-core.workspace = true
yc-audio.workspace = true
yc-ml.workspace = true
yc-llm.workspace = true
yc-text.workspace = true
yc-hub.workspace = true
yc-connect = { path = "../../crates/yc-connect" }
yc-mcp = { path = "../../crates/yc-mcp" }
anyhow.workspace = true
chrono.workspace = true
clap = { version = "4.5", features = ["derive"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["fs", "signal"] }
tokio-util.workspace = true
indicatif = "0.17"
dirs = "6"
symphonia = { version = "0.6.1", default-features = false, features = ["aac", "aiff", "alac", "flac", "isomp4", "mp3", "ogg", "pcm", "vorbis", "wav"] }
rubato = "5.0.1"
libc = "0.2"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }

[dev-dependencies]
yc-store.workspace = true
tempfile = "3"
