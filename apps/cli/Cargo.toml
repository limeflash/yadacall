[package]
name = "yadacall-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "yadacall"
path = "src/main.rs"

[dependencies]
yc-core.workspace = true
yc-audio.workspace = true
yc-ml.workspace = true
anyhow.workspace = true
clap = { version = "4.5", features = ["derive"] }
serde.workspace = true
serde_json.workspace = true
symphonia = { version = "0.6.1", default-features = false, features = ["aac", "aiff", "alac", "flac", "isomp4", "mp3", "ogg", "pcm", "vorbis", "wav"] }
rubato = "5.0.1"
libc = "0.2"
