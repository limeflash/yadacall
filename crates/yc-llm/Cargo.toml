[package]
name = "yc-llm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
yc-core.workspace = true
yc-text.workspace = true
async-stream = "0.3"
async-trait = "0.1"
chrono.workspace = true
futures-core = "0.3"
futures-util = "0.3"
keyring = "3.6"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["charset", "json", "rustls-tls", "stream"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util", "net", "process"] }
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects"] }
